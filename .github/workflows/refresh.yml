name: refresh stats

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow opencv-python-headless rembg onnxruntime
          
      - name: Generate Portrait and Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          python3 scripts/generate_portrait.py
          python3 scripts/generate_stats.py
          
      - name: Commit and push if changed
        run: |
          FILES="portrait.svg stats.svg streak.svg langs.svg year.svg assets/avatar.jpg"
          [ -z "$(git status --porcelain -- $FILES)" ] && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- $FILES
          git commit -m "profile: auto-refresh portrait and stats"
          git push
